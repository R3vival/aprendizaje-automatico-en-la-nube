name: Promover modelo

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Version del candidato; vacio usa el alias candidate.
        required: false
        type: string
      mejora_minima:
        description: Margen relativo minimo de mejora del MAE sobre el holdout.
        required: true
        default: "0.01"
        type: string
      umbral_subgrupo:
        description: Degradacion relativa maxima tolerada por subgrupo.
        required: true
        default: "0.05"
        type: string
      dry_run:
        description: Solo evaluar; no mover el alias champion.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  promover:
    name: Gate de calidad y promocion
    runs-on: ubuntu-latest
    # Configurar reglas de aprobacion para este Environment desde GitHub antes
    # de permitir dry_run=false en un repositorio compartido.
    environment: production
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuracion de Registry
        run: |
          test -n "$MLFLOW_TRACKING_URI" || {
            echo "Falta el secreto MLFLOW_TRACKING_URI del entorno production." >&2
            exit 1
          }

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependencias bloqueadas
        run: uv sync --group dev --locked

      - name: Evaluar y promover candidato
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          MEJORA_MINIMA: ${{ inputs.mejora_minima }}
          UMBRAL_SUBGRUPO: ${{ inputs.umbral_subgrupo }}
        run: |
          argumentos=(
            --mejora-minima "$MEJORA_MINIMA"
            --umbral-subgrupo "$UMBRAL_SUBGRUPO"
          )
          if [ -n "$CANDIDATE_VERSION" ]; then
            argumentos+=(--candidate-version "$CANDIDATE_VERSION")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            argumentos+=(--dry-run)
          fi
          uv run python -m BeijingAir.models.promote "${argumentos[@]}"
