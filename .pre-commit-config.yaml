# =============================================================================
# pre-commit — Aprendizaje Automatico en la Nube
# =============================================================================
# Instalacion:  make setup     (o: uv run pre-commit install)
# Ejecucion:    uv run pre-commit run --all-files
#
# Regla: el CI corre lo mismo que estos hooks. Si el hook pasa en local, el CI
# pasa. Si divergen, el hook deja de servir y la gente lo desactiva con
# --no-verify.
# =============================================================================
# Solo los tipos que algun hook implementa. Declarar `pre-push` instalaba un
# hook vacio que no verificaba nada.
default_install_hook_types: [pre-commit, commit-msg]
# Fija el interprete de los hooks. El Python por defecto del sistema (3.14)
# esta roto (falta html.entities), asi que se usa el 3.11 del proyecto.
default_language_version:
  python: python3.11

repos:
  # --- Higiene general ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|ipynb)$
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # 1500 KB: uv.lock del stack completo del curso supera los 500 KB.
        args: ["--maxkb=1500"]
      - id: detect-private-key

  # --- Lint + formato (Ruff reemplaza flake8, isort y black) ---
  # NO agregar Black aqui. La doc de Ruff advierte explicitamente contra
  # alternar los dos formatters en el mismo repositorio.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Notebooks sin outputs ---
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # --- Seguridad ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  # --- Conventional Commits ---
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            feat,
            fix,
            docs,
            style,
            refactor,
            perf,
            test,
            build,
            ci,
            chore,
            revert,
          ]
